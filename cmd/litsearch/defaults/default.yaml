# ===========================================================================
# classify
# ===========================================================================
classify:
  # Rules that annotate each record in progress.csv.
  #
  # Patterns are regular expressions (Perl/Python syntax, look-arounds allowed), matched case-insensitively
  # against title + abstract + keywords + MeSH unless a rule says "title".
  # Edit freely: the catalogue step re-derives every
  # annotation column from these rules on each run (it never touches the
  # hand-edited columns `notes` and `user_tags`).

  # ---------------------------------------------------------------------------
  # data layer the measure is built from; a record can carry several
  # ---------------------------------------------------------------------------
  modality:
    DNA methylation: '\bmethylat|\bDNAm|\bCpG|epigenetic (clock|age|aging|ageing)|methylome|\bEPIC array|\b450K\b|bisulfite|\bRRBS\b'
    histone/chromatin: '\bhistone|chromatin accessib|\bATAC-seq|\bH3K\d'
    transcriptomic: 'transcriptom|RNA-seq|gene expression|\bmRNA\b|expression profil'
    single-cell: 'single-cell|single cell|\bscRNA|\bsnRNA'
    proteomic: 'proteom|\bOlink\b|SomaScan|SomaLogic|plasma protein|serum protein|ProtAge'
    metabolomic: 'metabolom|\bmetabolite|Nightingale|MetaboAge|MetaboHealth|\bNMR\b'
    lipidomic: 'lipidom'
    glycomic: 'glycan|glycom|glycosylation'
    microbiome: 'microbio|metagenom|\b16S\b'
    telomere: 'telomer'
    clinical biomarkers: 'blood chemistr|clinical biomarker|clinical chemistr|biochemical marker|Klemera|\bKDM\b|homeostatic dysregulation|phenotypic age|routine (blood|clinical|laboratory)|laboratory (values|tests|biomarkers)|blood test'
    brain imaging: 'brain age|brain-predicted|BrainAGE|neuroimaging|\bMRI\b|magnetic resonance|brain-age'
    retinal imaging: '\bretina|fundus'
    ECG/cardiovascular: '\bECG\b|electrocardiogra|heart age|vascular age|arterial stiffness|pulse wave'
    facial/photographic: 'facial|face image|perceived age|3D face'
    physical function: '\bgait\b|grip strength|physical function|walking speed|accelerometer|wearable'
    frailty/deficit index: 'frailty|deficit accumulation'
    immune/inflammatory: 'immune age|\biAge\b|immunosenescen|inflammaging|inflamm-aging|IMM-AGE'
    multi-omic: 'multi-?omic|multi-?modal'

  # ---------------------------------------------------------------------------
  # organism
  # ---------------------------------------------------------------------------
  species:
    mouse: '\bmice\b|\bmouse\b|\bmurine\b|Mus musculus'
    rat: '\brats?\b'
    dog/cat: '\bdogs?\b|\bcanine\b|\bcats?\b|\bfeline\b'
    non-human primate: 'macaque|rhesus|chimpanzee|non-human primate|nonhuman primate|marmoset'
    multi-species/mammalian: 'pan-mammalian|universal (pan-)?mammalian|across mammal|mammalian species|cross-species'
    other vertebrates: 'zebrafish|\bbirds?\b|\bfish\b|\bbats?\b|whale|dolphin|horse|equine|cattle|bovine|sheep|\bpigs?\b|porcine|elephant|naked mole'
    invertebrates: 'drosophila|C\. elegans|Caenorhabditis|yeast'
    human: '\bhumans?\b|\bpatients?\b|\bparticipants?\b|\bindividuals\b|\bwomen\b|\bmen\b|\bchildren\b|\badults?\b|\bcohort\b|\bsubjects\b'

  # ---------------------------------------------------------------------------
  # what the work contributes; first matching rule wins (order matters)
  # ---------------------------------------------------------------------------
  category:
    - name: correction/retraction
      pub_types: 'Erratum|Retraction|Correction|Expression of Concern'
      title: '^(correction|erratum|retraction|retracted)\b|^(author )?correction to'
    - name: commentary
      pub_types: '^(Comment|Editorial|Letter|News)(;|$)|; (Comment|Editorial|Letter|News)(;|$)'
      title: '^(comment|editorial|reply|response to|letter)\b'
    - name: review
      pub_types: 'Review|Meta-Analysis|review-article'
      title: '\breview\b|systematic review|meta-analys|\boverview\b|state of the art|\bprimer\b|perspective|scoping|narrative review|\bconsensus\b|recommendations|roadmap|framework for'
    - name: software/resource
      title: '\b(R|Python) package|\bpackage\b|\bsoftware\b|\btool(kit|box)?s?\b|web ?server|web(-| )based (tool|calculator|platform)|\bdatabase\b|\batlas\b|\bpipeline\b|\bcompendium\b|\bresource\b|\bbenchmark(ing)? (dataset|platform|suite)|\bplatform\b'
    - name: benchmark/comparison
      text: 'compar\w* (of |between |across )?(\w+[ -]){0,4}(clocks|measures of (biological )?ag|aging measures|ageing measures|biomarkers of ag|predictors|age estimators)|\bbenchmark|head-to-head|test-retest|technical (noise|reliability)|reliability of (\w+ ){0,3}(clocks|measures)|systematic(ally)? (evaluat|compar)|performance of (\w+ ){0,4}clocks'
    - name: clock development
      # "we developed/trained ... a clock/predictor/score" with an aging word in
      # the same sentence (a generic "we developed a model" is not enough)
      text: '\b(we|I|here,? we|this study|in this (study|work|paper),? we)\b(?=[^.]{0,280}\b(age|ages|aging|ageing|clocks?|frailty|lifespan|longevity|mortality|senescence|biological age)\b)[^.]{0,100}\b(develop|construct|built|build|train|creat|deriv|establish|introduc|propos|present|design)\w*\b[^.]{0,140}\b(clocks?|predictors?|estimators?|scores?|indices|index|measures?|biomarkers?|signatures?|calculators?)\b'
      # "X as a predictor of mortality" is an application, so "predictor of"
      # only counts when what is predicted is an age
      title: '\b(novel|new|improved|refined|development|developing|construction|deriving|derivation)\b.{0,80}\b(clocks?|predictors?|estimators?|scores?|index|measures?|biomarkers?)\b|\b(clock|estimator) (for|of|based on|trained)\b|\bpredictors? (for|of) (\w+ )?(biological |chronological |epigenetic |gestational |brain |phenotypic )?age\b|^(\w+[ -]){0,3}(clock|Age)\b:'
    - name: intervention/trial
      text: '\brandomi[sz]ed\b|\bclinical trial\b|\bplacebo\b|\bintervention\b|\bsupplementation\b|caloric restriction|calorie restriction|exercise training|\breversal\b|\brejuvenat'
    - name: mechanism/genetics
      text: 'mendelian randomi[sz]ation|genome-wide association|\bGWAS\b|heritab|\bcausal\b|mechanis'

  # ---------------------------------------------------------------------------
  # tiering
  # ---------------------------------------------------------------------------
  # a record is "core" when one of these appears in its title (or its category
  # is one of core_categories); other records from focused searches are
  # "related". Seeds with a landmark role are "landmark".
  core_title_terms: 'clock|biological(ly)? ag|biologic age|epigenetic (age|aging|ageing)|methylation (age|aging|ageing)|DNAm ?age|\bage acceleration|accelerated (epigenetic )?ag|aging score|ageing score|aging index|ageing index|pace of (aging|ageing)|rate of (aging|ageing)|PhenoAge|GrimAge|DunedinP|Horvath|Hannum|frailty ind|frailty clock|deficit accumulation|methylation (risk )?score|epigenetic (risk )?score|EpiScore|poly-?epigenetic|methylation profile score|(DNAm|methylation|epigenetic) surrogate|biomarkers? of (healthy )?(aging|ageing)|(aging|ageing) biomarker|brain(-predicted)? age|phenotypic age|Klemera|homeostatic dysregulation|age (prediction|predictor|estimation|estimator)|predicted age|age gap|epigenetic predictor|MetaboAge|ProtAge|GlycanAge|\biAge\b|organ age|heart age|vascular age|retinal age|physiological age'

  landmark_roles: [registry_origin, registry_reference, benchmark, methods_reference]

  # category of papers that introduced an entry of a reference registry
  origin_category: clock development
  # categories that make a focused row "core" even without a title match
  core_categories: [clock development, benchmark/comparison, review, software/resource]
  # category of rows no rule matched
  default_category: application/association
  # data layers shown in the summary tables (default: every modality rule)
  summary_modalities: ["DNA methylation", "clinical biomarkers", "proteomic", "transcriptomic", "metabolomic",
    "brain imaging", "frailty/deficit index", "glycomic", "microbiome", "single-cell",
    "retinal imaging", "ECG/cardiovascular", "facial/photographic", "multi-omic"]

  # ---------------------------------------------------------------------------
  # named clocks and scores for the entities column (matched with word
  # boundaries, case-sensitive unless the pattern starts with (?i)); name: pattern
  # ---------------------------------------------------------------------------
  entities:
    Horvath2013 (pan-tissue): '(?i)Horvath(''s)? (multi-tissue |pan-tissue |)?(clock|age|DNAm ?age)|DNAmAge ?Horvath|Horvath2013|Horvath 2013'
    Hannum: '(?i)Hannum'
    Skin&Blood: '(?i)skin(-| and | & |&)blood clock|Horvath2018|skinandblood|DNAmAgeSkinBlood'
    PhenoAge (DNAm): '(?i)DNAm ?PhenoAge|Levine(''s)? (DNAm |epigenetic )?(clock|PhenoAge)'
    PhenoAge (clinical): '(?i)(clinical|phenotypic|blood[- ]based|biochemistry) PhenoAge|\bPhenotypic Age\b|Phenotypic Age Acceleration'
    PhenoAge: 'PhenoAge'
    GrimAge: 'GrimAge(?!2| ?v2|[- ]version 2)'
    GrimAge2: 'GrimAge ?2|GrimAge ?v2|GrimAge version 2'
    DunedinPACE: '(?i)DunedinPACE'
    DunedinPoAm: '(?i)DunedinPoAm'
    PC clocks: '\bPC(Horvath|Hannum|PhenoAge|GrimAge|DNAmTL|SkinBlood|Horvath1|Horvath2)|PC-?clocks?|principal[- ]component(-based)? (epigenetic )?clocks?'
    DNAmTL: 'DNAmTL|DNAm telomere length|DNAm-based telomere|(?i:DNA methylation[- ]based estimator of telomere length)'
    Zhang (EN/BLUP): '(?i)Zhang(''s)? (clock|elastic net|BLUP)|\bBLUP\b clock'
    Weidner: '(?i)Weidner'
    Lin99: '(?i)\bLin(''s)? (clock|99)'
    Vidal-Bralo: '(?i)Vidal-?Bralo'
    Wu (pediatric): '(?i)\bWu(''s)? clock'
    PedBE: 'PedBE'
    Knight (gestational): '(?i)Knight(''s)? (clock|gestational)'
    Bohlin (gestational): '(?i)Bohlin'
    EPIC gestational (Haftorn): '(?i)Haftorn|EPIC GA clock'
    Placental clocks (Lee/Mayne): '(?i)placental (epigenetic )?clock|Mayne(''s)? clock|refined robust placental'
    epiTOC: 'epiTOC ?[123]?|epiTOC'
    HypoClock: 'HypoClock'
    MiAge: 'MiAge'
    stemTOC: 'stemTOC'
    EpiCMIT: 'EpiCMIT'
    RepliTali: 'RepliTali'
    AltumAge: 'AltumAge'
    CausAge/DamAge/AdaptAge: 'CausAge|DamAge\b|AdaptAge'
    SystemsAge: '(?i)Systems ?Age'
    OMICmAge: 'OMICmAge|EMRAge'
    IntrinClock: 'IntrinClock'
    RetroAge: '(?i)Retro-?age|RetroClock'
    EnsembleAge: 'EnsembleAge'
    cAge/bAge: '\bcAge\b|\bbAge\b'
    DNAmFitAge: 'DNAmFitAge'
    DNAmFI/FIAge: 'DNAm ?FI\b|DNAmFI|FI ?Age\b|FIAge|epigenetic frailty (risk )?score'
    DNAmIC: 'DNAmIC'
    Pan-mammalian clocks: '(?i)(pan|universal)[- ]mammalian (epigenetic |methylation )?clocks?|Clock ?[123] \(mammal'
    Cortical clock: '(?i)cortical clock|DNAmClockCortical'
    Epigenetic Pacemaker: '(?i)epigenetic pacemaker'
    scAge / single-cell clocks: 'scAge|scImmuAging|sc-ImmuAging|single-cell (aging )?clocks?|(?i:(epigenetic|biological|transcriptomic) age[^.]{0,20}single cells?)'
    Mouse clocks (Petkovich/Stubbs/Meer/Thompson/Wang): '(?i)Petkovich|Stubbs(''s)? clock|Meer(''s)? clock|Thompson(''s)? clock|mouse (epigenetic |DNAm )?clock'
    CpGPT: 'CpGPT'
    Mortality risk score: '(?i)mortality risk score|\bMRscore'
    EpiScores: 'EpiScores?'
    Klemera-Doubal (KDM): '(?i)Klemera|\bKDM\b'
    Homeostatic dysregulation: '(?i)homeostatic dysregulation|Mahalanobis distance'
    Frailty index: '(?i)frailty ind(ex|ices)|\bFI-?Lab\b|deficit accumulation'
    BrainAGE / brain age: '(?i)brain ?age|brain-predicted age|BrainAGE|brain-PAD'
    MetaboAge/MetaboHealth: 'MetaboAge|MetaboHealth'
    ProtAge / proteomic clocks: '(?i)ProtAge|proteomic (aging )?clocks?|organ (aging )?clocks?|organ age'
    GlycanAge: '(?i)GlycanAge|glycan (age|clock)'
    iAge / immune clocks: '\biAge\b|IMM-AGE|(?i:immune (age|clock))'
    Transcriptomic clocks: '(?i)transcriptomic (age|clock)|RNAAgeCalc|Peters(''s)? transcriptomic'
    Microbiome clocks: '(?i)microbiome (age|clock)|microbial clock'
    Retinal age: '(?i)retinal age'
    Heart/vascular age: '(?i)heart age|vascular age|ECG[- ]age'
    LinAge: 'LinAge ?2?'
    Healthy Aging Index: '(?i)healthy ag(e)?ing index'
