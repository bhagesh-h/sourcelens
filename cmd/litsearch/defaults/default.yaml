# ===========================================================================
# repos
# ===========================================================================
repos:
  # Repository and package searches.
  #
  # github_queries: run against the GitHub repository search API (forks
  #   excluded). Each query returns at most 1000 repositories.
  # relevance: a GitHub search hit is kept only if its name, description or
  #   topics match this pattern (search matches README text too, which is
  #   noisy). Word boundaries matter: "brain age" must not match "brain-agent",
  #   "BioAge" must not match "BioAgents". Re-evaluated on every build.
  #   Repositories linked from a catalogued paper or from the local projects
  #   are always kept.
  # package_terms: matched against CRAN / Bioconductor package titles and
  #   descriptions, and used as PyPI name guesses.

  github_queries:
    - "epigenetic clock"
    - "epigenetic clocks"
    - "epigenetic age"
    - "epigenetic aging"
    - "DNA methylation age"
    - "methylation clock"
    - "methylation age"
    - "aging clock"
    - "ageing clock"
