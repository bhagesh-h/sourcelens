# litsearch default configuration: the topic used when no other topic is given.
#
# It catalogues research on epigenetic clocks, biological-age clocks, aging
# scores, frailty indices and methylation risk scores. A catalogue keeps its
# own copy of this file in <catalogue>/config/litsearch.yaml; edit that copy,
# not this one. Every key is described in docs/configuration.md.
#
# Sections
#   search     date window, sources, search groups and terms
#   classify   rules that fill the category, modality, entities, species and tier columns
#   repos      GitHub queries, relevance pattern, package terms, known packages
#   websites   curated websites, databases and calculators

topic: "aging clocks and biomarkers"

# Local folders mined for DOIs and links (absolute paths). Folders with a
# clock registry (registry/data/clocks.yaml) or literature manifests
# (literature/manifest*.tsv) are read in more detail.
references: []

# How reference folders are read.
seeds:
  # manifest rows whose topic matches this pattern are methods references (landmark)
  methods_topics: '^clocks|aging-clocks'
  # paths (relative to the parent of a reference folder) that are skipped
  skip_paths: ["300BCG/literature/0", "300BCG/literature/1", "/papers/"]
  # links kept from reference folders besides code and data hosts
  keep_url_domains: 'clockfoundation|shinyapps\.io|dnamage|clockbase|biolearn|computage|agingbiomarkers|biomarkersofaging|genomics\.senescence|ngdc\.cncb\.ac\.cn|synapse\.org|ukbiobank'

# ===========================================================================
# search
# ===========================================================================
search:
  # Every group is searched in each source listed in `sources` (pubmed,
  # europepmc, arxiv, openalex), in title and abstract.
  #
  # terms: phrases matched in title or abstract; "a & b" requires both. A group can also carry
  #   require_any: a second list; a record must then match one term from `terms`
  #   AND one from `require_any` (both title/abstract). Used to keep broad words
  #   such as "frailty" or "aging" on topic.
  #
  # scope:
  #   focused  -> results go into progress.csv
  #   broad    -> results go into corpus/broad_hits.csv only (metadata,
  #               no full text), because a bare "aging" or "frailty" returns tens
  #               of thousands of clinical and basic-biology papers that are not
  #               about measuring biological age. Anything in a broad group that
  #               also matches a focused group is in progress.csv anyway.
  #
  # Date window: start_date to end_date. end_date "today" means the date of the
  # run, so re-running the pipeline later picks up everything published since.

  start_date: "2011-01-01"
  end_date: "today"

  # sources searched for this topic (OpenAlex is left out here: the groups
  # below are biomedical and PubMed plus Europe PMC already cover them)
  sources: [pubmed, europepmc, arxiv]

  # Europe PMC is asked for non-MEDLINE records only (preprints, PMC-only,
  # Agricola, theses, ...) because PubMed already returns MEDLINE. Set to "all"
  # to have Europe PMC re-run MEDLINE too (slower; useful as a cross-check when
  # its service is fast).
  europepmc_sources: nonmed

  groups:

    epigenetic_clocks:
      scope: focused
      label: "Epigenetic / DNA methylation clocks"
      terms:
        - "epigenetic clock"
        - "epigenetic clocks"
