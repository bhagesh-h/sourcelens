  # packages known from the local projects' documentation (FALCONAge, 300BCG,
  # 300OB) that the searches may not surface by description
  known_packages:
    # clock implementations only; preprocessing (minfi, sesame) and cell-type
    # deconvolution (EpiDISH, FlowSorted) packages are not aging resources
    cran: [BioAge, dnaMethyAge, DunedinPACE, meffonym, methylCIPHER, cAge]
    bioconductor: [methylclock, methylclockData, wateRmelon, ENmix, planet, MEAT]
    pypi: [pyaging, biolearn, falconage, altumage, epigenetic-clock, clockbase]

# ===========================================================================
# websites
# ===========================================================================
websites:
  # Curated websites, databases, calculators and data resources for aging clocks.
  #
  # Each entry is verified live by the websites step and the
  # page's own <title> is recorded next to the name given here. `urls` lists
  # alternatives tried in order. A site that refuses automated requests (HTTP
  # 401/403/429) is kept with a note; one that is offline is kept only if the
  # Internet Archive has a copy, which then becomes its link. Entries whose
  # identity could not be verified (empty page, unrelated title) were removed.
  # `date` is filled from the earliest Internet Archive snapshot unless given.
  # `related_doi` links the site to the paper that introduced it, if any.
  #
  # Starting points came from the local projects (FALCONAge registry and docs,
  # 300BCG, 300OB); links mined from catalogued papers are added automatically
  # from websites/candidate_websites.csv when a domain is cited by
  # several papers and its home page is about aging measurement.

  # sites cited by several papers are kept when their title or description matches
  relevance: '(?i)aging|ageing|clock|longevity|biological age|methylation|epigenetic|lifespan|frailty|biomarker|senescence|healthspan'

  sites:
    - name: Clock Foundation
      urls: [https://clockfoundation.org/]
      type: organization
      note: Non-profit founded around the Horvath clocks; runs the DNA methylation age calculator.
    - name: DNA Methylation Age Calculator (Clock Foundation)
      urls: [https://dnamage.clockfoundation.org/]
      type: web calculator
      note: Online calculator for Horvath, Hannum, PhenoAge, GrimAge and other DNAm clocks.
    - name: DNA Methylation Age Calculator (legacy UCLA)
      urls: [http://dnamage.genetics.ucla.edu/, http://labs.genetics.ucla.edu/horvath/dnamage/]
      type: web calculator
      note: Original calculator released with Horvath 2013.
      related_doi: 10.1186/gb-2013-14-10-r115
    - name: TranslAGE
      urls: [https://www.translage.io/]
      type: clock database / platform
      note: Catalogue of epigenetic clocks cited by the FALCONAge registry.
    - name: ClockBase
      urls: [https://clockbase.org/]
      type: database
      note: Aging-clock scores computed across public methylation datasets.
    - name: Biomarkers of Aging Consortium
      urls: [https://www.agingconsortium.org/, https://www.biomarkersofaging.org/]
      type: consortium
      note: Consortium behind the biomarkers-of-aging framework and Biolearn.
    - name: Biolearn documentation
      urls: [https://bio-learn.github.io/]
      type: software documentation
    - name: pyaging documentation
      urls: [https://pyaging.readthedocs.io/]
      type: software documentation
      related_doi: 10.1093/bioinformatics/btae200
    - name: ComputAgeBench benchmark dataset
      urls: [https://huggingface.co/datasets/computage/computage_bench]
      type: benchmark dataset
    - name: Human Ageing Genomic Resources (HAGR)
      urls: [https://genomics.senescence.info/]
      type: database
    - name: AnAge (animal ageing and longevity database)
      urls: [https://genomics.senescence.info/species/]
      type: database
    - name: Aging Atlas
      urls: [https://ngdc.cncb.ac.cn/aging/]
      type: database
    - name: EWAS Atlas
      urls: [https://ngdc.cncb.ac.cn/ewas/atlas]
      type: database
    - name: XPRIZE Healthspan
      urls: [https://www.xprize.org/prizes/healthspan]
      type: initiative
      note: Competition scored in part with aging biomarkers.
    - name: UK Biobank
      urls: [https://www.ukbiobank.ac.uk/]
      type: cohort data resource
      note: Training and validation data for proteomic, metabolomic and clinical clocks.
    - name: NHANES
      urls: [https://www.cdc.gov/nchs/nhanes/]
      type: cohort data resource
      note: Training data for clinical PhenoAge and KDM biological age.
    - name: Dunedin Study
      urls: [https://dunedinstudy.otago.ac.nz/]
      type: cohort data resource
      note: Cohort behind the Pace of Aging, DunedinPoAm and DunedinPACE.
    - name: Health and Retirement Study
      urls: [https://hrs.isr.umich.edu/]
      type: cohort data resource
      note: Releases epigenetic clock values for its participants.
    - name: Generation Scotland
      urls: [https://www.ed.ac.uk/generation-scotland]
      type: cohort data resource
      note: Cohort behind EpiScores and several clock comparisons.
    - name: Lothian Birth Cohorts
      urls: [https://www.ed.ac.uk/lothian-birth-cohorts]
      type: cohort data resource
    - name: Framingham Heart Study
      urls: [https://www.framinghamheartstudy.org/]
      type: cohort data resource
    - name: TruDiagnostic
      urls: [https://www.trudiagnostic.com/]
      type: commercial test provider
    - name: GlycanAge
      urls: [https://glycanage.com/]
      type: commercial test provider
    - name: Tally Health
      urls: [https://tallyhealth.com/]
      type: commercial test provider
    - name: myDNAge (Epimorphy / Zymo)
      urls: [https://www.mydnage.com/]
      type: commercial test provider
