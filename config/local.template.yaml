# litSearch local settings: paths on this machine and credentials.
#
# Copy this file to config/local.yaml and fill it in. config/local.yaml is
# git-ignored and read only by the launchers (python/run.sh, go/run.sh, ...):
# they mount the paths into the containers and pass the credentials as
# environment variables, never as files. Keep one value per line.

# Output folder: progress.csv, full texts, corpus, changelog, logs and the
# live configuration (<research_dir>/config/litsearch.yaml, seeded from
# config/litsearch.template.yaml on first use).
research_dir: /path/to/output/folder

# Local projects mined (read-only) for seed references and links; each is
# mounted at /refs/<folder name>. Remove the lines to run without them.
reference_repos:
  - /path/to/FALCONAge
  - /path/to/300BCG
  - /path/to/300OB

# Contact address for the polite pools of Crossref, OpenAlex and NCBI, and
# required by Unpaywall (Unpaywall is skipped while this is empty).
contact_email: you@example.org

# Optional API credentials; leave empty to go without. An empty github_token
# is taken from `gh auth token` at run time when the GitHub CLI is logged in.
github_token: ""
openalex_api_key: ""
ncbi_api_key: ""
