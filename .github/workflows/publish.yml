name: publish

# Publishes the Python package "sourcelens" with PyPI trusted publishing (no
# API token stored in GitHub). Step-by-step setup and release instructions:
# publish.md.
#
#   push a tag vX.Y.Z           -> build, check, test, publish to PyPI
#   Actions > publish > Run     -> build, check, test, publish to TestPyPI (default) or PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the versions agree
        run: |
          py=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/sourcelens/__init__.py)
          go=$(sed -n 's/^var version = "\(.*\)"/\1/p' cmd/sourcelens/main.go)
          echo "Python package: $py   Go default: $go"
          test "$py" = "$go" || { echo "::error::src/sourcelens/__init__.py ($py) and cmd/sourcelens/main.go ($go) differ"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "v$py" = "${GITHUB_REF_NAME}" || { echo "::error::tag ${GITHUB_REF_NAME} does not match version $py"; exit 1; }
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
          ls -l dist

      - name: Test the built wheel
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl pytest
          /tmp/venv/bin/sourcelens version
          /tmp/venv/bin/sourcelens test
          /tmp/venv/bin/python -m pytest -q tests

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/sourcelens/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sourcelens/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
