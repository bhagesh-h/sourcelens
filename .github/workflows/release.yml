name: release

# Push a tag such as v1.0.0 to build the Go binaries for Linux and macOS and
# attach them to a GitHub release. The Python package is published by
# publish.yml from the same tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: make release
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/sourcelens_*
          generate_release_notes: true
