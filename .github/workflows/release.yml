name: release

# Push a tag such as v1.0.0 to build the Go binaries, attach them to a GitHub
# release, and publish the Python package to PyPI. PyPI publishing uses
# trusted publishing: register this repository and workflow as a trusted
# publisher of the "litsearch" project on pypi.org first.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: make release
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/litsearch_*

  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
