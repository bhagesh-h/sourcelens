[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "litsearch"
dynamic = ["version"]
description = "Collect the latest research on any topic: papers, preprints, open-access full texts, code and websites in one append-only catalogue."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Bhagesh" }]
requires-python = ">=3.10"
keywords = ["literature search", "systematic review", "bibliography", "pubmed", "openalex", "arxiv", "open access"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
    "lxml>=4.9",
]

[project.optional-dependencies]
# better PDF to Markdown/text conversion; without it poppler-utils is used when installed
pdf = ["pymupdf>=1.24", "pymupdf4llm>=0.0.17"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
litsearch = "litsearch.cli.litsearch:entry"

[project.urls]
Homepage = "https://github.com/bhagesh-h/litSearch"
Documentation = "https://github.com/bhagesh-h/litSearch#readme"
Issues = "https://github.com/bhagesh-h/litSearch/issues"

[tool.hatch.version]
path = "src/litsearch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/litsearch"]
exclude = ["src/litsearch/defaults/default.yaml"]

[tool.hatch.build.targets.wheel.force-include]
"cmd/litsearch/defaults/default.yaml" = "litsearch/defaults/default.yaml"

[tool.hatch.build.targets.sdist]
include = [
    "src/litsearch",
    "cmd/litsearch/defaults/default.yaml",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# long regular expressions that must match the Go implementation character for character
"src/litsearch/common/settings.py" = ["E501"]
"src/litsearch/pullrepos/build_repos.py" = ["E501"]
